# Rename `app` if the name is taken — everything else can stay.
app = "gfpbap-transcript"
primary_region = "iad"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.http_options.response.headers]
    # Belt-and-braces: main.py sets these too, but a 500 from the platform
    # rather than the app would otherwise reach the browser without them.
    Access-Control-Allow-Origin = "*"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
