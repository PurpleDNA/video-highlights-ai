# Deploy web/ to GitHub Pages.
#
# Pages can only serve a repository's root or its /docs folder, and this app
# lives in web/ while /docs holds design notes. So rather than restructure the
# repo to suit the host, the upload step below takes web/ as the artifact root
# and the site is served from there.
#
# Nothing is built. web/ is already a complete static site with every
# dependency vendored (see web/vendor/), which is the same property that lets
# the PWA work offline — so "deploy" here is a file copy, and what ships is
# byte-for-byte what runs locally.
name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it: a half-applied Pages
# deployment is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No install step: the suite is node --test with no dependencies.
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
